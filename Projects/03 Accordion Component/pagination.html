<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./assets/css/pagination.css" />
    <title>Pagination</title>
  </head>
  <body>
    <main class="container">
      <nav>
        <a href="./index.html" class="nav-link nav-active">Breadcrumb page</a>
        <a href="./carousel.html" class="nav-link">Carousel page</a>
        <a href="./table.html" class="nav-link">Table page</a>
      </nav>

      <section class="pagination-container">
        <a href="#" class="pagination-items">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
            class="arrow"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M15.75 19.5 8.25 12l7.5-7.5"
            />
          </svg>
        </a>
        <a href="#" class="pagination-items active-page">1</a>
        <a href="#" class="pagination-items">2</a>
        <a href="#" class="pagination-items">3</a>
        <a href="#" class="pagination-items">4</a>
        <span class="">...</span>
        <a href="#" class="pagination-items">100</a>
        <a href="#" class="pagination-items">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
            class="arrow"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="m8.25 4.5 7.5 7.5-7.5 7.5"
            />
          </svg>
        </a>
      </section>
    </main>
  </body>
</html>
